[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-learning-kit"
version = "0.1.0"
description = "Unified Future AGI SDK for agent learning workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Future AGI", email = "hello@futureagi.io" }]
keywords = [
  "ai-agents",
  "agent-testing",
  "agent-simulation",
  "agent-evaluation",
  "agent-optimization",
  "red-teaming",
  "future-agi",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "claude-agent-sdk>=0.2.139",
  "fi-instrumentation-otel>=0.1.16",
  "gepa>=0.0.17",
  # 2.8 imports newer otel semconv than the livekit-agents pin allows
  "google-adk>=2.7.1,<2.8",
  "httpx>=0.24.0",
  "jsonschema>=4.25.1,<5",
  "levenshtein>=0.25.0",
  "litellm>=1.80.0,<2",
  "nltk>=3.9.0",
  "numpy>=1.26.4",
  "openai>=1.109.1,<3",
  "opentelemetry-api>=1.39.1,<2",
  "opentelemetry-exporter-otlp>=1.39.1,<2",
  "opentelemetry-sdk>=1.39.1,<2",
  "optuna>=3.6.1",
  "pandas>=2.0.0",
  "pydantic>=2.0,<3",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "requests>=2.32.5,<3",
  "requests-futures>=1.0.0",
  # ALK pins httpx>=0.24; retell-sdk needs httpx<1,>=0.23 — compatible.
  # 5.64+: call.list posts to /v3 with the v3 filter vocabulary (D12);
  # <5.64 used /v2 with a different typed shape.
  "retell-sdk>=5.64,<6",
  "rich>=13.0.0",
  "rouge-score>=0.1.2",
  "typer>=0.9.0,<1.0.0",
]

[project.optional-dependencies]
simulate = []
evaluation = []
optimize = []
livekit = [
  "aiohttp>=3.10",
  "audioop-lts>=0.2.1; python_version >= '3.13'",
  "livekit-agents[cartesia,deepgram,openai,silero,google]>=1.2",
  "livekit-plugins-elevenlabs>=1.2",
]
langchain = [
  "langchain-core>=1.4.6,<2",            # verified latest stable on PyPI 2026-06-11
  "langgraph>=1.2.4,<2",                 # verified latest stable on PyPI 2026-06-11
  "langgraph-checkpoint-sqlite>=3.1.0",  # verified latest stable on PyPI 2026-06-11
]
pipecat = [
  # Latest stable is 1.3.0 (PyPI 2026-06-11) but pipecat-ai>=1.0 requires
  # Python >=3.11 while the kit supports >=3.10; 0.0.108 is the newest floor
  # that resolves for the full supported range. No upper bound: 3.11+ envs
  # may resolve the 1.x line.
  "pipecat-ai>=0.0.108",
]
mcp = [
  "mcp>=1.27,<2",                        # verified latest stable on PyPI 2026-06-11 (1.27.2)
]
a2a = [
  "a2a-sdk[http-server]>=1.1.0",         # verified latest stable on PyPI 2026-06-11; http-server extra powers the loopback peer
]
nli = ["transformers>=5.2.0,<6", "torch>=2.10.0,<3"]
embeddings = ["sentence-transformers>=5.2.3,<6"]
# What `harness-ui/server.py` needs to serve the harness over HTTP. Declared rather than left to
# whatever happens to be in the environment: uv sync removes anything undeclared, so an ad hoc
# install of these disappears the first time somebody syncs.
harness-ui = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
# Stores the harness can provision for an agent under test. Each engine the
# harness can stand up needs a driver to seed it, read its state and put it
# back; the container itself is pulled at build time, not declared here.
harness-stores = [
  "psycopg[binary]>=3.2",
]
feedback = ["chromadb>=0.4.0"]
notebook = [
  "ipykernel>=6",                        # kernel for examples/agent_learning_sdk_demo.ipynb
  "nbformat>=5",
]
trinity = [
  "aiohttp>=3.10",
  "audioop-lts>=0.2.1; python_version >= '3.13'",
  "livekit-agents[cartesia,deepgram,openai,silero,google]>=1.2",
  "livekit-plugins-elevenlabs>=1.2",
]
all = [
  "aiohttp>=3.10",
  "audioop-lts>=0.2.1; python_version >= '3.13'",
  "chromadb>=0.4.0",
  "livekit-agents[cartesia,deepgram,openai,silero,google]>=1.2",
  "livekit-plugins-elevenlabs>=1.2",
  "sentence-transformers>=5.2.3,<6",
  "torch>=2.10.0,<3",
  "transformers>=5.2.0,<6",
]

[project.scripts]
agent-learn = "fi.alk.cli:main"
alk = "fi.alk.cli:main"
alk-harness-worker = "fi.alk.harness.hosted_entrypoint:main"
alk-harness-sandbox = "fi.alk.harness.sandbox_server:main"

[project.urls]
Homepage = "https://futureagi.com"
Documentation = "https://docs.futureagi.com"
Repository = "https://github.com/future-agi/agent-learning-kit"
Issues = "https://github.com/future-agi/agent-learning-kit/issues"
Changelog = "https://github.com/future-agi/agent-learning-kit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/fi"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src",
  "tests",
  "examples",
  "docs",
  "README.md",
  "LICENSE",
  "NOTICE",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "CODE_OF_CONDUCT.md",
  "ROADMAP.md",
]
exclude = [
  "examples/artifacts",
  "**/__pycache__",
  "**/*.pyc",
]

[dependency-groups]
dev = [
  "build>=1.5",
  "hatchling>=1.25",
  "pytest>=8.3",
  "ruff>=0.9",
  # Also in the harness-ui extra. Repeated here so that syncing without that extra does not
  # uninstall the server out from under a working checkout.
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
markers = [
  "live_lane: opt-in live framework lane (umbrella; never set in release flows)",
  "live_livekit: real livekit-agents AgentSession lane (AGENT_LEARNING_LIVE_LIVEKIT=1)",
  "live_pipecat: real Pipecat Pipeline lane (AGENT_LEARNING_LIVE_PIPECAT=1)",
  "live_langchain: real LangChain/LangGraph compiled-graph lane (AGENT_LEARNING_LIVE_LANGCHAIN=1)",
  "live_mcp: real MCP server-process lane (AGENT_LEARNING_LIVE_MCP=1)",
  "live_a2a: real A2A peer lane (AGENT_LEARNING_LIVE_A2A=1)",
  "live_credentialed: rungs that need real provider credentials (AGENT_LEARNING_LIVE_CREDENTIALED=1 AND creds present)",
  "integration: exercises the real simulation engine end-to-end (credential-free; slower than unit tests)",
]

[tool.bandit]
# This kit runs candidate/agent code BY DESIGN — the bench sandbox executors and
# the live-lane runners invoke subprocess/docker as their core, reviewed mechanism
# (always list-args, never shell=True). So the subprocess-family findings are
# expected here, not defects; real isolation lives in the Docker lane (network
# off, cap-drop ALL, no-new-privileges, read-only, non-root). Site-specific
# exceptions carry inline `# nosec <ID> — <reason>`.
skips = ["B404", "B603", "B607"]
exclude_dirs = ["tests"]
