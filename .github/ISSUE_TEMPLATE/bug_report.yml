name: Bug report
description: Report a reproducible problem in Agent Learning Kit.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, manifest, code, or example needed to reproduce.
      placeholder: |
        uv run ...
        agent-learn ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, Node, OS, package version, and relevant extras.
    validations:
      required: false
